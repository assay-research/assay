<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#eceeef;--card:#f8f9f9;--ink:#191c1f;--ink-soft:#5a6269;
  --rule:#d2d7d9;--accent:#275b61;
  --font-sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131619;--card:#1b1f23;--ink:#e4e6e7;--ink-soft:#9aa2a8;
    --rule:#2c3237;--accent:#7eb4ba;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131619;--card:#1b1f23;--ink:#e4e6e7;--ink-soft:#9aa2a8;
  --rule:#2c3237;--accent:#7eb4ba;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:72px 48px}
p.code{
  font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin:0 0 12px;
}
h1{font-size:clamp(26px,5.4vw,34px);line-height:1.1;margin:0 0 14px;
  font-weight:700;letter-spacing:-.02em;text-wrap:balance}
p{margin:0 0 18px;color:var(--ink-soft)}
ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
a{
  display:block;padding:14px 16px;background:var(--card);
  border:1px solid var(--rule);border-radius:4px;
  color:var(--accent);text-decoration:none;font-weight:600;
}
a span{display:block;color:var(--ink-soft);font-weight:400;font-size:14px;margin-top:3px}
a:hover{border-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <p class="code">Error 404</p>
  <h1>That page is not here</h1>
  <p>Nothing is at this address. The whole site is two pages:</p>
  <ul>
    <li><a href="/">What the Leaderboards Hide
      <span>The measurement: 47,190 ranked accounts, every exclusion counted, six findings.</span></a></li>
    <li><a href="/check/">Leaderboard Reality Check
      <span>The tool: one address in, nine checks out. Runs in your browser.</span></a></li>
  </ul>
</div>
</body>
</html>
